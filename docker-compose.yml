services:
  backend:
    container_name: finance-backend-main
    image: gitlab.thompson.uz:5050/finance/backend:main
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379
      - UPLOAD_DIR=/app/uploads
    depends_on:
      - db
      - redis
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-backend.rule=Host(`finance.thompson.uz`) && PathPrefix(`/api`)"
      - "traefik.http.routers.finance-backend.entrypoints=websecure"
      - "traefik.http.routers.finance-backend.tls.certresolver=le"
      - "traefik.http.services.finance-backend.loadbalancer.server.port=8000"

  bot_worker:
    container_name: finance-bot-worker
    image: gitlab.thompson.uz:5050/finance/backend:main
    command: python bot_worker.py
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379
      - BOT_TOKEN=${BOT_TOKEN}
    restart: unless-stopped
    depends_on:
      - db
      - redis
    networks:
      - internal

  frontend:
    container_name: finance-frontend-main
    image: gitlab.thompson.uz:5050/finance/frontend:main
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-frontend.rule=Host(`finance.thompson.uz`)"
      - "traefik.http.routers.finance-frontend.entrypoints=websecure"
      - "traefik.http.routers.finance-frontend.tls.certresolver=le"
      - "traefik.http.services.finance-frontend.loadbalancer.server.port=80"

  db:
    container_name: finance-db
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    networks:
      - internal

  redis:
    container_name: finance-redis
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
  web:
    external: true

volumes:
  uploads_data:
  postgres_data:
